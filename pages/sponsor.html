<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sponsor MeT | 赞助支持</title>
    <link rel="icon" href="/res/favicon.ico" type="image/x-icon">
    <meta name="description"
        content="Sponsor MeTerminator - WeChat Pay & Alipay Support | 赞助支持 MeTerminator - 微信支付与支付宝支持">
    <link rel="stylesheet" href="/res/contact.css">
    <link rel="stylesheet" href="/res/sponsor.css">
</head>

<body>
    <div class="sponsor-container">
        <!-- WeChat Pay Card -->
        <div class="profile-card">
            <h1 class="nickname">微信支付 / WeChat Pay</h1>
            <div class="qr-section">
                <div class="qr-box">
                    <img src="/res/sponsor_wechat.png" alt="WeChat Pay QR Code" class="qr-code">
                </div>
                <div class="qq-display">
                    使用微信扫码赞助支持
                </div>
            </div>
        </div>

        <!-- Alipay Card -->
        <div class="profile-card">
            <h1 class="nickname">支付宝 / Alipay</h1>
            <div class="qr-section">
                <div class="qr-box">
                    <img src="/res/sponsor_alipay.png" alt="Alipay QR Code" class="qr-code">
                </div>
                <div class="qq-display">
                    使用支付宝扫码赞助支持
                </div>
            </div>
        </div>
    </div>

    <!-- Unified Back Button -->
    <div class="footer-nav">
        <a href="/p/bio" class="primary-btn">返回名片 / Back</a>
    </div>

    <!-- Vercel Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <!-- Vercel Speed Insights -->
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>

</html>

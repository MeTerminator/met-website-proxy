<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MeTerminator | 联系方式</title>
    <link rel="icon" href="/res/favicon.ico" type="image/x-icon">
    <meta name="description" content="MeTerminator 联系与赞助支持方式">
    <link rel="stylesheet" href="/res/contact.css">
</head>

<body>
    <div class="card-container">
        <!-- Main Card -->
        <div id="main-card" class="profile-card">
            <a href="/home/" target="_blank" class="header-link">
                <div class="avatar-box">
                    <img src="/res/avatar_QQ3532095196.jpg" alt="MeTerminator" class="avatar">
                </div>
                <h1 class="nickname">MeTerminator</h1>
            </a>
            <a href="/home/" class="home-link" target="_blank">
                个人主页
            </a>
            <div class="qr-section">
                <a href="https://qm.qq.com/q/CUG7wzOxDE" target="_blank">
                    <div class="qr-box">
                        <img src="/res/qrcode_QQ3532095196.png" alt="QQ QR Code" class="qr-code">
                    </div>
                </a>
                <div class="qq-display" onclick="copyQQ('3532095196')">
                    QQ: 3532095196
                </div>
            </div>

            <div class="btn-group">
                <a href="https://qm.qq.com/q/CUG7wzOxDE" class="primary-btn" target="_blank">添加好友 / Contact</a>
                <a href="/p/bio" class="sponsor-btn">名片 / Bio</a>
                <a href="/p/sponsor" class="sponsor-btn">赞助支持 / Sponsor</a>
            </div>
        </div>

        <!-- Furry Card -->
        <div id="furry-card" class="profile-card">
            <a href="/home/" target="_blank" class="header-link">
                <div class="avatar-box">
                    <img src="/res/avatar_QQ3578235616.jpg" alt="MeTerminator" class="avatar">
                </div>
                <h1 class="nickname">MeTerminator</h1>
            </a>
            <a href="/home/" class="home-link" target="_blank">
                个人主页
            </a>
            <div class="qr-section">
                <a href="https://qm.qq.com/q/irysRcYiC4" target="_blank">
                    <div class="qr-box">
                        <img src="/res/qrcode_QQ3578235616.png" alt="QQ QR Code" class="qr-code">
                    </div>
                </a>
                <div class="qq-display" onclick="copyQQ('3578235616')">
                    QQ: 3578235616
                </div>
            </div>

            <div class="btn-group">
                <a href="https://qm.qq.com/q/irysRcYiC4" class="primary-btn" target="_blank">添加好友 / Contact</a>
                <a href="/p/bio" class="sponsor-btn">名片 / Bio</a>
                <a href="/p/sponsor" class="sponsor-btn">赞助支持 / Sponsor</a>
            </div>
        </div>
    </div>

    <div class="footer-selector">
        <div class="selector-toggle" onclick="toggleSelector()" id="selector-toggle">
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </div>
        <div class="footer-nav-wrapper" id="selector-wrapper">
            <div class="footer-nav">
                <div id="nav-main" class="nav-item" onclick="switchTo('main')">QQ for Main</div>
                <div id="nav-furry" class="nav-item" onclick="switchTo('furry')">QQ for Furry</div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">QQ 已复制到剪贴板</div>

    <script src="/res/contact.js"></script>
    <!-- Vercel Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <!-- Vercel Speed Insights -->
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>

</html>
